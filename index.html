<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>부위 타격 전투 프로토타입</title>
<style>
  html,body{margin:0;background:#050506;color:#d8d0c0;font-family:AppleMyungjo,"Noto Serif KR","Nanum Myeongjo",Batang,Georgia,serif}
  #wrap{max-width:960px;margin:0 auto;padding:8px;position:relative}
  canvas{width:100%;display:block;image-rendering:pixelated;background:#000;border:1px solid #8a8272;box-sizing:border-box}
  #hud{display:grid;grid-template-columns:1fr 300px;gap:8px;margin-top:8px;min-height:150px}
  #cmd{background:#000;border:1px solid #8a8272;padding:10px;box-shadow:inset 0 0 0 3px #000,inset 0 0 0 4px #3a362e}
  #title{font-weight:700;margin-bottom:8px;color:#e8dcc0;letter-spacing:.04em}
  #btns{display:flex;flex-wrap:wrap;gap:6px}
  #btns button{background:#000;color:#d8d0c0;border:1px solid #5a554a;padding:7px 12px;font:inherit;cursor:pointer;text-align:left;min-width:120px}
  #btns button:hover:not(:disabled){background:#17130f;border-color:#e8dcc0;color:#fff}
  #btns button:disabled{opacity:.35;cursor:not-allowed}
  #btns button small{display:block;font-size:11px;color:#8a8478;margin-top:2px}
  #btns button.back{min-width:60px;border-color:#6a2a24;color:#c89a8a}
  #log{background:#000;border:1px solid #8a8272;padding:8px 10px;font-size:12px;line-height:1.6;height:150px;overflow-y:auto;box-sizing:border-box;box-shadow:inset 0 0 0 3px #000,inset 0 0 0 4px #3a362e}
  #log b{color:#e8dcc0} #log .r{color:#c8483e} #log .g{color:#8aa870} #log .b{color:#9aa8c0}
  #top{display:flex;gap:12px;align-items:center;font-size:12px;margin-bottom:6px;color:#8a8478}
  #top label{cursor:pointer}
  #overlay{position:absolute;inset:8px;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
  #overlay h1{margin:0;font-size:30px;color:#e8dcc0;letter-spacing:.08em}
  #overlay p{margin:0;max-width:560px;font-size:13px;line-height:1.7;color:#b8b0a0}
  #overlay button{font:inherit;font-size:18px;padding:10px 28px;background:#3a0c0a;color:#e8dcc0;border:1px solid #e8dcc0;cursor:pointer}
  #stage{position:relative}
  #hud{display:block;min-height:0}
  #cmd{position:absolute;left:0;right:0;top:66%;height:0;background:none;border:0;box-shadow:none;padding:0;pointer-events:none}
  #title{position:absolute;right:60.5%;bottom:6px;margin:0;font-size:13px;text-shadow:0 0 4px #000,0 0 4px #000,0 0 6px #000;white-space:nowrap}
  #btns{display:block}
  #btns .col{position:absolute;top:0;width:15%;display:flex;flex-direction:column;gap:4px;pointer-events:auto}
  #btns .col.l{right:60.5%} #btns .col.r{left:60.5%}
  #btns button{min-width:0;padding:4px 8px;font-size:12px;background:rgba(0,0,0,.86)}
  #btns button small{font-size:10px;line-height:1.25}
  #log{height:110px}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <span>부위 타격 턴제 전투 · 프로토타입</span>
    <label><input type="checkbox" id="auto"> 자동 전투</label>
    <label><input type="checkbox" id="mute"> 음소거</label>
  </div>
  <div id="stage"><canvas id="c" width="960" height="540"></canvas>
    <div id="cmd"><div id="title"></div><div id="btns"></div></div></div>
  <div id="hud"><div id="log"></div></div>
  <div id="overlay">
    <h1 id="ovTitle">용사 파티 vs 고블린 무리</h1>
    <p id="ovText">모든 공격은 <b>부위 룰렛</b>으로 맞는 부위가 정해집니다. 부위가 파괴되면 성직자의 복원이나 응급 키트 없이는 회복되지 않습니다.<br>
    공격하면 조준점이 대상의 몸 위를 흔들리며 훑다가 멈춘 곳이 맞는 부위가 됩니다. 빨간 점(목·심장)은 <b>급소 — 즉사</b>. 용사 파티는 투구(목 1회)와 방패(심장)로 즉사를 막을 수 있습니다.</p>
    <button id="start">전투 시작</button>
  </div>
</div>

<script>
'use strict';
/* ================= 기본 ================= */
const $=id=>document.getElementById(id);
const W=960,H=540,P=3;
const cv=$('c'),ctx=cv.getContext('2d');
const rand=(a,b)=>a+Math.random()*(b-a);
const choice=a=>a[Math.floor(Math.random()*a.length)];
const easeOut=t=>1-Math.pow(1-t,3),easeQuart=t=>1-Math.pow(1-t,4),linear=t=>t;
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* ================= 시간 (히트스톱 / 슬로모션) ================= */
let timeScale=1,hitstop=0,slowT=0;
const tweens=[],timers=[];
const sleep=t=>new Promise(r=>timers.push({t,r}));
const tween=(o,to,dur,ease=easeOut)=>new Promise(r=>{const from={};for(const k in to)from[k]=o[k];tweens.push({o,from,to,dur,t:0,ease,r});});
function stepTime(dt){
  if(dt<=0)return;
  for(let i=timers.length-1;i>=0;i--){const m=timers[i];m.t-=dt;if(m.t<=0){timers.splice(i,1);m.r();}}
  for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const p=Math.min(1,w.t/w.dur),e=w.ease(p);
    for(const k in w.to)w.o[k]=w.from[k]+(w.to[k]-w.from[k])*e;
    if(p>=1){tweens.splice(i,1);w.r();}}
}

/* ================= 소리 (WebAudio 합성) ================= */
let AC=null,master,bgm,noiseBuf;
function initAudio(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=$('mute').checked?0:.8;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);

function stepFx(dt,dtReal){

function hitPoint(t,part,dir){const a=partPos(t,part);return {x:ux(t)+a[0]-dir*6,y:uy(t)+a[1]};}
// 타격 연출 한 묶음: 히트스톱 + 화면 + 피격 반응 + 파티클 + 소리
function impact(t,part,dir,tier,mat,power=1){
  const kd=dir;dir=choice([1,-1]);
  const T=TIER[tier],hp=hitPoint(t,part,dir);
  hitstop=Math.max(hitstop,T.stop);
  cam.shT=.18;cam.shMag=T.shake;cam.dx=dir*.45;cam.dy=kd*.8;
  cam.punch=T.zoom*1.5;cam.flash=T.flash;cam.chroma=T.chroma;
  if(T===TIER.vital)slowT=.6;
  t.flash=.07;t.kv+=kd*T.knock/t.weight;t.sqv+=3+T.zoom*20;
  const k=t.kick[part];
  if(part==='head'){k.x=-3;k.y=-1;t.hitLean=-.3;}
  else if(part==='legs'){k.x=-3;t.hitLean=.18;}
  else if(part==='torso'){k.x=-2;t.hitLean=-.12;}
  else{k.x=-3;k.y=2;t.hitLean=-.08;}
  t.hitLean=0;
  hitReact(t,part,dir,T,mat);
  {const ps=spr(t).poses;if(ps){if(mat!=='flesh'&&ps.alt&&ALT[t.id]==='guard')t.pose='alt';else if(ps.hit)t.pose='hit';}}
  strikeFx(t,hp,dir,T,mat);
  if(mat==='flesh'){gush(hp.x,hp.y,dir,T,t);sfx.flesh(power);}
  else if(mat==='metal'){sparks(hp.x,hp.y,dir,T.n+6);sparks(hp.x,hp.y,-dir,5);sfx.metal(power);}
  else{debris(hp.x,hp.y,dir,6,['#8a6236','#5a3e20'],t.y);sparks(hp.x,hp.y,dir,4);sfx.wood(power);}
  if(tier==='brk'||tier==='vital'){sfx.crack();crack(t.x,t.y+4);}
  if(tier==='vital')sfx.boom();
}

/* ================= 부위 룰렛 (대상의 몸 위에서 진행) ================= */
const roul={show:false,segs:[],seq:[],times:[],i:0,t:0,cur:null,result:null,done:false,target:null,att:null,res:null,label:''};
let focusUnits=[];
const ROW_ORDER=['head','neck','torso','heart','mainArm','offArm','legs','miss'];
const ANCH={head:[0,-43],neck:[0,-38],torso:[-1,-28],heart:[2,-32],mainArm:[8,-28],offArm:[-8,-28],legs:[0,-9],miss:[-15,-28]};
function buildSegs(att,tgt,opt){
  const w=Object.assign({},BASE_W);
  for(const k in att.wmods)w[k]*=att.wmods[k];
  for(const k of LIMBS)if(tgt.sev[k]){w.torso+=w[k];w[k]=0;}          // 없는 사지는 맞지 않는다
  if(opt.aim){w[opt.aim]*=3;if(opt.aim==='head')w.neck*=3;if(opt.aim==='torso')w.heart*=3;w.miss=22;}
  if(att.parts.head.broken)w.miss*=2;
  w.miss*=1+.4*painOf(att);                                           // 고통: 빗나감 증가
  if(tgt.evade)w.miss*=severe(tgt)?1.5:3;
  if(severe(tgt)){w.neck*=2.5;w.heart*=2.5;w.miss*=.4;}                  // 중상: 급소가 드러나고 피하지 못한다
  if(tgt.parts.legs.broken||tgt.stun>0)w.miss=0;
  const tot=SEG_ORDER.reduce((s,k)=>s+w[k],0);
  return SEG_ORDER.filter(k=>w[k]>0).map(k=>({k,frac:w[k]/tot}));
}
// 결과는 실제 확률로 먼저 정하고, 그 전까지 몸의 부위를 옮겨 다니며 점점 느려진다
function spinBody(segs,att,tgt,n){
  let r=Math.random(),idx=segs.length-1,acc=0;
  for(let i=0;i<segs.length;i++){acc+=segs[i].frac;if(r<acc){idx=i;break;}}
  const result=segs[idx].k,seq=[],times=[];let prev=null,t=.1;
  const pickDisp=ex=>{const c=segs.filter(s=>!ex.includes(s.k)),ws=c.map(s=>Math.max(s.frac,.06));
    let q=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<c.length;i++){q-=ws[i];if(q<=0)return c[i].k;}return c[c.length-1].k;};
  for(let i=0;i<n;i++){
    const k=i===n-1?result:pickDisp(i===n-2?[prev,result]:[prev]);
    seq.push(k);times.push(t);prev=k;t+=.05+.26*Math.pow(i/(n-1),2.4);
  }
  Object.assign(roul,{rx:null,ry:null,show:true,segs,seq,times,i:0,t:0,cur:null,result,done:false,target:tgt,att,label:`${att.name} → ${tgt.name}`});
  return new Promise(res=>roul.res=res);
}
function stepRoul(dt){
  stepRoulCore(dt);
  if(!roul.show||!roul.target||!roul.cur)return;
  // 조준점은 고른 부위로 곧장 뛰지 않고, 흔들리며 미끄러져 간다. 멈출수록 흔들림이 잦아든다
  const t=roul.target,a=partPos(t,roul.cur),prog=roul.i/Math.max(1,roul.seq.length),wob=roul.done?0:(1-prog)*11+3,now=performance.now();
  const tx=ux(t)+a[0]+Math.sin(now*.013)*wob,ty=uy(t)+t.kx*.45+a[1]+Math.cos(now*.017)*wob*.8;
  if(roul.rx==null){const at=roul.att;roul.rx=ux(at)+face(at)*60;roul.ry=uy(at)-spr(at).h*.6*at.sc;}
  const k=Math.min(1,dt*(roul.done?30:12));roul.rx+=(tx-roul.rx)*k;roul.ry+=(ty-roul.ry)*k;
}
function stepRoulCore(dt){
  if(!roul.show||roul.done||!roul.res)return;
  roul.t+=dt;
  while(roul.i<roul.seq.length&&roul.t>=roul.times[roul.i]){roul.cur=roul.seq[roul.i++];if(roul.i<roul.seq.length)sfx.tick(roul.cur==='neck'||roul.cur==='heart');}
  if(roul.i>=roul.seq.length){roul.done=true;const hot=roul.cur==='neck'||roul.cur==='heart';sfx.lock(hot);if(hot)duck(1.2);
    const r=roul.res;roul.res=null;setTimeout(()=>r(roul.result),auto()?300:hot?900:600);}
}

function log(html){const l=$('log');l.insertAdjacentHTML('beforeend','<div>'+html+'</div>');l.scrollTop=l.scrollHeight;}
const nm=u=>`<b class="${u.team==='h'?'b':'r'}">${u.name}</b>`;
function onBreak(t,part,dir=1){
  const limb=LIMBS.includes(part);
  if(part==='head')t.stun=1;
  if(part==='torso')t.bleed=true;
  if(part==='legs'&&t.covering){t.covering.coveredBy=null;t.covering=null;}
  t.pain+=limb?2:1;
  if(!limb)dent(t,part);                                                  // 머리·몸통은 부서져 꺼진 상처가 남는다
  if(limb){
    sever(t,part,dir);pools.push({x:ux(t),y:t.y+3,r:4,max:rand(30,46)});t.shock=2;t.staunch=false;t.writhe=2;slowT=Math.max(slowT,.45);sfx.scream(t.team==='g');
    const hp=hitPoint(t,part,dir);blood(hp.x,hp.y,dir,16,t.y);blood(hp.x,hp.y,-dir,5,t.y);
    (async()=>{                                                            // 뒤늦게 비틀거리며 몇 걸음 헛디딘다
      await sleep(.34);
      for(let i=0;i<3&&t.alive;i++){await tween(t.rz,{x:rand(-13,13),y:rand(-3,9)},.15,easeOut);t.sqv+=3;await sleep(.12);}
      if(part==='legs')for(let i=0;i<2&&t.alive;i++){await sleep(.4);t.sqv-=5;await sleep(.24);t.sqv+=6;        // 다리를 잃으면 일어서려다 다시 주저앉는다
        spawn(ux(t),t.y,0,4,{colors:['#5a5448','#3e3a34'],sizes:[4],v0:-70,v1:70,vy0:-50,vy1:-10,g:300,life:.4,fade:true});}
    })();
  }
  floater(ux(t),headY(t)-10,PN[part]+(limb?' 절단!':' 파괴!'),'#ff5a5a',limb?24:20);
  log(`${nm(t)}의 <span class="r">${PN[part]} ${limb?'절단':'파괴'}</span> — ${BREAK_DESC[part]}`);
  if(limb)log(`${nm(t)} <span class="r">고통·쇼크·출혈</span> — 빗나감 증가, 2턴간 받는 피해 +30%·속도 -3, 지혈 전까지 매 턴 -3`);
}
function die(t,why){
  t.alive=false;t.hp=0;t.stun=0;t.bleed=false;
  if(t.covering){t.covering.coveredBy=null;t.covering=null;}
  if(t.coveredBy){t.coveredBy.covering=null;t.coveredBy=null;}
  if(spr(t).poses&&spr(t).poses.hit)t.pose='hit';
  slowT=Math.max(slowT,.3);sfx.thud();pools.push({x:ux(t),y:t.y+3,r:6,max:rand(60,92)});
  t.fside=choice([1,-1]);t.tense=0;t.writhe=0;
  (async()=>{
    t.shake=.25;await tween(t,{cr:.2},.24,easeOut);                         // 무릎이 꺾인다
    tween(t,{x:Math.max(90,Math.min(W-90,t.x+t.fside*rand(70,210))),y:t.y+rand(-10,14)},.42,easeOut);   // 맞은 힘에 옆으로 내동댕이쳐진다
    await tween(t,{fall:1,cr:0,alpha:.9},.4,q=>q*q);t.sqv+=5;sfx.thud();   // 옆으로 쓰러져 바닥에 부딪힌다
    if(spr(t).poses&&spr(t).poses.dead){t.pose='dead';t.fall=0;t.alpha=1;t.flipx=t.fside<0;t.air=0;t.staged=false;t.home={x:t.x,y:t.y,sc:t.sc};}   // 시체는 쓰러진 자리에 그대로 남는다
    spawn(ux(t),t.y,0,6,{colors:['#5a5448','#3e3a34'],sizes:[4,6],v0:-90,v1:90,vy0:-60,vy1:-10,g:300,life:.5,fade:true});
    for(let i=0;i<5;i++){await sleep(rand(.25,.8));t.tw=.14;t.sqv+=rand(1.5,3)/(i+1);}    // 숨이 끊어지며 몇 번 경련한다
  })();
  log(`${nm(t)} <span class="r">${why||'쓰러짐'}</span>`);
}

  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;

      if(Math.random()<.5)dctx.fillRect(dx+sg*(dw+choice([1,2,4])),dy+choice([-1,0,1]),choice([1,2]),1);}dctx.globalAlpha=1;}parts.splice(i,1);continue;}
    if(p.life<=0)parts.splice(i,1);}
  for(let i=trails.length-1;i>=0;i--){trails[i].t+=dt;if(trails[i].t>=trails[i].max)trails.splice(i,1);}
  for(let i=floaters.length-1;i>=0;i--){floaters[i].t+=dt||dtReal*.1;if(floaters[i].t>=1.1)floaters.splice(i,1);}
}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame);}

/* ================= 시작 ================= */
$('mute').onchange=()=>{if(master)master.gain.value=$('mute').checked?0:.8;};
$('start').onclick=()=>{initAudio();if(AC&&AC.state==='suspended')AC.resume();$('overlay').style.display='none';setup();battle();};
setup();loadSprites();requestAnimationFrame(frame);
window.__game={get units(){return units;},roul,cam,SPR,addGore,gibs,onBreak,getRig,ATK,die:(u,w)=>die(u,w),severe,segs:(a,t,o)=>buildSegs(a,t,o||{}),rebuild:(u,p)=>rebuildBody(u,p),fxs,splats,pools,impact:(...a)=>impact(...a),setAtk:u=>curAtk=u,tick(dt){update(dt);render();}};
</script>
